name: CI

# Builds and tests every push and pull request. No secrets are used here, so it runs for forks too.
#
# The macOS matrix is the expensive part — two Xcode versions, a full test run each — and a change that only
# touches the website cannot break a Swift build. So the site is checked on every commit (it is seconds of Python)
# and the app is built only when something outside the site has changed.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Supersede a pull request's earlier run, but let a push to main finish. Cancelling those meant a string of
  # quick commits left no completed run at all, and the result everyone was waiting on never existed.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # What changed, so the expensive job can be skipped when nothing it covers did.
  changes:
    # Pinned rather than `ubuntu-latest`: that label moves to Ubuntu 26 in October 2026, and every run has
    # been carrying an annotation saying so. A named image means the move happens when we make it, with a
    # green run to prove it, rather than on a date somebody else chose. macOS is already pinned the same way.
    runs-on: ubuntu-24.04
    outputs:
      app: ${{ steps.what.outputs.app }}
      site: ${{ steps.what.outputs.site }}
      python: ${{ steps.what.outputs.python }}
      actions: ${{ steps.what.outputs.actions }}
      pages: ${{ steps.what.outputs.pages }}
      head_sha: ${{ steps.what.outputs.head_sha }}
      tree: ${{ steps.what.outputs.tree }}
      fingerprint: ${{ steps.what.outputs.fingerprint }}
      schema: ${{ steps.what.outputs.schema }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # A pull-request check is attached to the head SHA, so build that head—not GitHub's synthetic merge ref.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - id: what
        name: Classify the exact change with trusted policy
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TRUSTED_POLICY_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
        run: |
          set -euo pipefail
          # The checked-out head is the input being classified, never the authority that decides which checks it
          # needs. Load that policy from the immutable base commit (or the current main push) so a pull request
          # cannot edit its own classifier to skip application work.
          git show "$TRUSTED_POLICY_SHA:scripts/classify_changes.py" > "$RUNNER_TEMP/classify_changes.py"
          python3 -I "$RUNNER_TEMP/classify_changes.py" \
            --repo . --base "$BASE_SHA" --head "$HEAD_SHA" \
            > "$RUNNER_TEMP/change-classification.json"
          jq -r '
            "app=\(.app)",
            "site=\(.site)",
            "python=\(.python)",
            "actions=\(.actions)",
            "pages=\(.pages)",
            "head_sha=\(.head_sha)",
            "tree=\(.tree)",
            "fingerprint=\(.app_fingerprint)",
            "schema=flowlight-review-v3"
          ' "$RUNNER_TEMP/change-classification.json" >> "$GITHUB_OUTPUT"
          jq . "$RUNNER_TEMP/change-classification.json"

  evidence:
    name: reusable app evidence
    needs: changes
    if: >-
      github.event_name == 'pull_request' &&
      github.repository == 'xinbetween/flowlight' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      reuse: ${{ steps.reuse.outputs.reuse }}
      source_run_id: ${{ steps.reuse.outputs.source_run_id }}
      source_run_attempt: ${{ steps.reuse.outputs.source_run_attempt }}
      source_artifact_id: ${{ steps.reuse.outputs.source_artifact_id }}
      source_artifact_name: ${{ steps.reuse.outputs.source_artifact_name }}
      source_artifact_digest: ${{ steps.reuse.outputs.source_artifact_digest }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      # The verifier treats every lookup, metadata, archive, and receipt error as a cache miss. A cache miss only
      # costs macOS time; it can never turn missing or malformed evidence into a passing app review.
      - id: reuse
        name: Find direct executed evidence for the exact full tree
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ needs.changes.outputs.head_sha }}
          SOURCE_TREE: ${{ needs.changes.outputs.tree }}
          APP_FINGERPRINT: ${{ needs.changes.outputs.fingerprint }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          TRUSTED_VERIFIER_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          ACTUAL_SHA=$(git rev-parse 'HEAD^{commit}')
          ACTUAL_TREE=$(git rev-parse 'HEAD^{tree}')
          [[ "$SOURCE_SHA" == "$ACTUAL_SHA" ]]
          [[ "$SOURCE_TREE" == "$ACTUAL_TREE" ]]
          # Reuse is an optimization, so the first release that introduces this verifier simply executes every
          # current job. Once the verifier exists on main, only those immutable base-commit bytes may authorize a
          # cache hit; the pull request's own copy is never executed as evidence policy.
          if ! git show "$TRUSTED_VERIFIER_SHA:scripts/workflow_evidence.py" \
              > "$RUNNER_TEMP/workflow_evidence.py" 2>/dev/null; then
            echo "reuse=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 -I "$RUNNER_TEMP/workflow_evidence.py" find-reuse \
            --repository "$REPOSITORY" \
            --source-sha "$ACTUAL_SHA" \
            --source-tree "$ACTUAL_TREE" \
            --app-fingerprint "$APP_FINGERPRINT" \
            --current-run-id "$CURRENT_RUN_ID" \
            --github-output "$GITHUB_OUTPUT"

  # Seconds of Python, so it runs on everything: the site is generated from Swift sources and project.yml as well
  # as from site/, and "docs/ is out of date" should be caught whichever of those moved.
  site:
    needs: changes
    # Pinned rather than `ubuntu-latest`: that label moves to Ubuntu 26 in October 2026, and every run has
    # been carrying an annotation saying so. A named image means the move happens when we make it, with a
    # green run to prove it, rather than on a date somebody else chose. macOS is already pinned the same way.
    runs-on: ubuntu-24.04
    steps:
      # Full history: the sitemap dates each page from the commit that last touched its source, and a shallow
      # clone can only see one commit, so every page would look as though it changed today.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Validate and verify the official rule-pack catalog
        env:
          PREVIOUS_CATALOG_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python3 -I scripts/rule_pack_catalog.py validate rule-packs/official-source.json
          python3 -I scripts/rule_pack_catalog.py compare \
            rule-packs/official-source.json site/packs/v1/official.json
          if [ -n "$PREVIOUS_CATALOG_REF" ] && \
             git cat-file -e "$PREVIOUS_CATALOG_REF:site/packs/v1/official.json" 2>/dev/null; then
            python3 -I scripts/rule_pack_catalog.py compare-previous site/packs/v1/official.json \
              --previous-ref "$PREVIOUS_CATALOG_REF"
          fi
          APP_VERSION=$(sed -n 's/.*MARKETING_VERSION:[[:space:]]*"\(.*\)".*/\1/p' project.yml)
          test -n "$APP_VERSION"
          python3 -I scripts/rule_pack_catalog.py verify site/packs/v1/official.json \
            --public-key Flowlight/Resources/RulePacks/official-rule-packs-v1-public.pem \
            --expected-key-id flowlight-rule-packs-2026-01 --current-app-version "$APP_VERSION" \
            --extension-protocol 1 --now "$(date +%s)"
          python3 scripts/release_notes.py "$APP_VERSION" >/dev/null

      - name: Check the site builds and is committed
        run: |
          python3 scripts/build_site.py
          if [ -n "$(git status --porcelain -- docs/)" ]; then
            git status --short -- docs/
            echo "::error::docs/ is out of date — run scripts/build_site.py and commit the result."
            exit 1
          fi

      # The build is a template renderer: it cannot fail on a placeholder that did not render, a link to a
      # section that exists in English only, a font that came back from Google, or a roadmap still promising
      # what you can already download. Each of those shipped once. check_site.py is where they go to stay
      # fixed, and it runs on every branch — these are mistakes to catch before the release, not at the merge.
      - name: Check the built site
        run: python3 scripts/check_site.py --ci

      # The site is served from docs/ on main, and its Download button points at
      # releases/latest/download/Flowlight.dmg. So a main that announces a version before the release exists
      # sends people to the previous DMG while telling them a newer one is out. Version work belongs on a
      # release branch — where this check doesn't run — and merges to main only once the tag has published.
      - name: The site must not announce a version that has no release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # sed, not `tr -dc '0-9.'`: that kept the 2 from <h2> on both ends and turned 0.7.8 into 20.7.82.
          site=$(sed -n 's|.*<h2>\([0-9][0-9.]*\)</h2>.*|\1|p' site/pages/releases.html | head -1)
          released=$(gh api "repos/${{ github.repository }}/releases/latest" -q .tag_name | sed 's/^v//')
          echo "site announces $site · latest release is $released"
          if [ "$site" != "$released" ] && [ "$(printf '%s\n%s\n' "$site" "$released" | sort -V | tail -1)" = "$site" ]; then
            echo "::error::The site announces $site but the newest release is $released. Tag and publish the"
            echo "::error::release first, then merge the release branch into main so the download link works."
            exit 1
          fi

          # The same claim lives in README's "Shipped:" list, where it is a ticked checkbox rather than a
          # download button — so it went unnoticed that it credited a version nobody could install. Anything
          # ticked has to exist.
          bad=0
          while read -r version; do
            [ -z "$version" ] && continue
            if [ "$version" != "$released" ] && \
               [ "$(printf '%s\n%s\n' "$version" "$released" | sort -V | tail -1)" = "$version" ]; then
              echo "::error file=README.md::README ticks ($version) as shipped, but the newest release is $released."
              bad=1
            fi
          done <<< "$(sed -n '/^Shipped:/,/^Planned/p' README.md | grep -o '([0-9]\+\.[0-9]\+\.[0-9]\+)' | tr -d '()')"
          [ "$bad" -eq 0 ] || exit 1

      - name: Create the exact validated Pages payload
        if: >-
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          github.repository == 'xinbetween/flowlight'
        env:
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ needs.changes.outputs.head_sha }}
          SOURCE_TREE: ${{ needs.changes.outputs.tree }}
        run: |
          set -euo pipefail
          python3 -I scripts/workflow_evidence.py create-pages \
            --root docs \
            --output "$RUNNER_TEMP/pages-payload.tar" \
            --repository "$REPOSITORY" \
            --source-sha "$SOURCE_SHA" \
            --source-tree "$SOURCE_TREE"

      - name: Preserve the validated Pages payload
        if: >-
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          github.repository == 'xinbetween/flowlight'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pages-site-${{ needs.changes.outputs.head_sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pages-payload.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  project-drift-execute:
    name: project drift execution
    needs: [changes, evidence]
    if: >-
      always() &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.app == 'true' &&
      needs.evidence.outputs.reuse != 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the project and reject drift
        run: scripts/check_xcode_project.sh

  unit-oldest-execute:
    name: unit oldest execution
    needs: [changes, evidence]
    if: >-
      always() &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.app == 'true' &&
      needs.evidence.outputs.reuse != 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Select Xcode
        run: |
          set -euo pipefail
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | head -1)"
          xcodebuild -version

      # Ad-hoc signing: the entitlements that need a Developer ID profile are only exercised by the release build.
      - name: Test
        timeout-minutes: 40
        run: scripts/run-ci-tests.sh

  unit-newest-execute:
    name: unit newest execution
    needs: [changes, evidence]
    if: >-
      always() &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.app == 'true' &&
      needs.evidence.outputs.reuse != 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Select Xcode
        run: |
          set -euo pipefail
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Check release helpers, catalog policy, and warning gate
        run: |
          scripts/test-notarize.sh
          scripts/test-rule-pack-policy.sh
          scripts/test-swift-warnings.sh
          scripts/test-codeql-gate.sh
          scripts/test-update-cask.sh
          python3 -I scripts/test_classify_changes.py
          python3 -I scripts/test_workflow_evidence.py
          python3 -I scripts/check_chart_palette.py
          python3 -I scripts/test_chart_palette.py
          python3 -I scripts/test_check_site.py
          python3 -I scripts/test_release_checks.py
          python3 -I scripts/test_release_artifact.py
          python3 -I scripts/test_release_workflow.py

      # Ad-hoc signing: the entitlements that need a Developer ID profile are only exercised by the release build.
      - name: Test
        timeout-minutes: 40
        run: scripts/run-ci-tests.sh

  store-execute:
    name: store execution
    needs: [changes, evidence]
    if: >-
      always() &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.app == 'true' &&
      needs.evidence.outputs.reuse != 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Select newest Xcode
        run: |
          set -euo pipefail
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Test Store-hosted inspection
        run: |
          xcodebuild test -project Flowlight.xcodeproj -scheme "Flowlight App Store" \
            -configuration Debug -destination 'platform=macOS' -derivedDataPath "$RUNNER_TEMP/store-tests" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Prove Store product gates reject unsafe fixtures
        run: |
          set -euo pipefail
          for fixture in \
            --self-test-read-only \
            --self-test-missing-proxy-server \
            --self-test-missing-proxy-attribution \
            --self-test-forbidden-symbol; do
            if scripts/check_app_store_product.sh "$fixture"; then
              echo "::error::Store product fixture unexpectedly passed: $fixture"
              exit 1
            fi
          done

      # This compiles a different product graph and activation path from the Developer ID build. The build clears
      # protected entitlements because CI has no Store profiles; the next step re-signs the isolated product with the
      # repository plists so the product gate still inspects the actual executable entitlements it is meant to police.
      - name: Build the Mac App Store product
        run: |
          set +e
          LOG="$RUNNER_TEMP/store-build.log"
          xcodebuild build -project Flowlight.xcodeproj -scheme "Flowlight App Store" \
            -configuration AppStore -destination 'generic/platform=macOS' -derivedDataPath "$RUNNER_TEMP/store-build" \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= CODE_SIGN_ENTITLEMENTS= > "$LOG" 2>&1
          status=$?
          set -e
          grep -E "warning:|error:|\\*\\* BUILD" "$LOG" | tail -80 || true
          if [[ "$status" -ne 0 ]]; then
            exit "$status"
          fi
          scripts/check-swift-warnings.sh "$LOG"

      - name: Check the Mac App Store product structure and signed entitlements
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/store-build/Build/Products/AppStore/Flowlight.app"
          EXTENSION="$APP/Contents/PlugIns/com.flowlight.app.filter.appex"
          codesign --force --sign - --entitlements FlowlightExtension/FlowlightExtension-AppStore.entitlements "$EXTENSION"
          codesign --force --sign - --entitlements Flowlight/Flowlight-AppStore.entitlements "$APP"
          scripts/check_app_store_product.sh "$APP"

  # These current-run gates preserve the required check names even when the expensive implementation was reused.
  # A missing or invalid receipt leaves REUSE false and therefore requires the corresponding execution job.
  project-drift:
    name: project drift
    if: always()
    needs: [changes, evidence, project-drift-execute]
    runs-on: ubuntu-24.04
    steps:
      - name: Require executed or reusable project drift evidence
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          APP_ROUTE: ${{ needs.changes.outputs.app }}
          REUSE: ${{ needs.evidence.outputs.reuse }}
          EXECUTION_RESULT: ${{ needs.project-drift-execute.result }}
        run: |
          set -euo pipefail
          [[ "$CHANGES_RESULT" == success ]]
          if [[ "$APP_ROUTE" == true ]]; then
            if [[ "$REUSE" == true ]]; then
              [[ "$EXECUTION_RESULT" == skipped ]]
            else
              [[ "$EXECUTION_RESULT" == success ]]
            fi
          else
            [[ "$EXECUTION_RESULT" == skipped ]]
          fi

  unit-oldest:
    name: unit (oldest Xcode)
    if: always()
    needs: [changes, evidence, unit-oldest-execute]
    runs-on: ubuntu-24.04
    steps:
      - name: Require executed or reusable oldest-Xcode evidence
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          APP_ROUTE: ${{ needs.changes.outputs.app }}
          REUSE: ${{ needs.evidence.outputs.reuse }}
          EXECUTION_RESULT: ${{ needs.unit-oldest-execute.result }}
        run: |
          set -euo pipefail
          [[ "$CHANGES_RESULT" == success ]]
          if [[ "$APP_ROUTE" == true ]]; then
            if [[ "$REUSE" == true ]]; then
              [[ "$EXECUTION_RESULT" == skipped ]]
            else
              [[ "$EXECUTION_RESULT" == success ]]
            fi
          else
            [[ "$EXECUTION_RESULT" == skipped ]]
          fi

  unit-newest:
    name: unit (newest Xcode)
    if: always()
    needs: [changes, evidence, unit-newest-execute]
    runs-on: ubuntu-24.04
    steps:
      - name: Require executed or reusable newest-Xcode evidence
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          APP_ROUTE: ${{ needs.changes.outputs.app }}
          REUSE: ${{ needs.evidence.outputs.reuse }}
          EXECUTION_RESULT: ${{ needs.unit-newest-execute.result }}
        run: |
          set -euo pipefail
          [[ "$CHANGES_RESULT" == success ]]
          if [[ "$APP_ROUTE" == true ]]; then
            if [[ "$REUSE" == true ]]; then
              [[ "$EXECUTION_RESULT" == skipped ]]
            else
              [[ "$EXECUTION_RESULT" == success ]]
            fi
          else
            [[ "$EXECUTION_RESULT" == skipped ]]
          fi

  store:
    name: store
    if: always()
    needs: [changes, evidence, store-execute]
    runs-on: ubuntu-24.04
    steps:
      - name: Require executed or reusable Store evidence
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          APP_ROUTE: ${{ needs.changes.outputs.app }}
          REUSE: ${{ needs.evidence.outputs.reuse }}
          EXECUTION_RESULT: ${{ needs.store-execute.result }}
        run: |
          set -euo pipefail
          [[ "$CHANGES_RESULT" == success ]]
          if [[ "$APP_ROUTE" == true ]]; then
            if [[ "$REUSE" == true ]]; then
              [[ "$EXECUTION_RESULT" == skipped ]]
            else
              [[ "$EXECUTION_RESULT" == success ]]
            fi
          else
            [[ "$EXECUTION_RESULT" == skipped ]]
          fi

  # Exact-head evidence proves what was reviewed; this separate PR-only build proves that same head still compiles
  # when combined with the current base. The trees are intentionally different, so this is not duplicate work.
  merge-compatibility:
    name: merge compatibility
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.app == 'true'
    runs-on: macos-15
    steps:
      # On pull_request, checkout's event default is GitHub's prospective merge commit. Do not construct a ref from
      # event data here: CodeQL correctly treats explicit untrusted-ref checkout as a separate attack surface.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Build the prospective merge
        run: |
          set -euo pipefail
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild build -project Flowlight.xcodeproj -scheme Flowlight -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/merge-build" \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= CODE_SIGN_ENTITLEMENTS=

  gate:
    name: Review / gate
    if: always()
    needs:
      - changes
      - evidence
      - site
      - project-drift-execute
      - unit-oldest-execute
      - unit-newest-execute
      - store-execute
      - project-drift
      - unit-oldest
      - unit-newest
      - store
      - merge-compatibility
    runs-on: ubuntu-24.04
    steps:
      - name: Require every applicable review job
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          SITE_RESULT: ${{ needs.site.result }}
          PROJECT_DRIFT_RESULT: ${{ needs.project-drift.result }}
          UNIT_OLDEST_RESULT: ${{ needs.unit-oldest.result }}
          UNIT_NEWEST_RESULT: ${{ needs.unit-newest.result }}
          STORE_RESULT: ${{ needs.store.result }}
          MERGE_RESULT: ${{ needs.merge-compatibility.result }}
          EVENT_NAME: ${{ github.event_name }}
          APP_ROUTE: ${{ needs.changes.outputs.app }}
          HEAD_SHA: ${{ needs.changes.outputs.head_sha }}
          TREE: ${{ needs.changes.outputs.tree }}
          FINGERPRINT: ${{ needs.changes.outputs.fingerprint }}
          SCHEMA: ${{ needs.changes.outputs.schema }}
          REUSE: ${{ needs.evidence.outputs.reuse }}
          SOURCE_RUN_ID: ${{ needs.evidence.outputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ needs.evidence.outputs.source_run_attempt }}
          SOURCE_ARTIFACT_ID: ${{ needs.evidence.outputs.source_artifact_id }}
          SOURCE_ARTIFACT_NAME: ${{ needs.evidence.outputs.source_artifact_name }}
          SOURCE_ARTIFACT_DIGEST: ${{ needs.evidence.outputs.source_artifact_digest }}
          PROJECT_DRIFT_EXECUTION: ${{ needs.project-drift-execute.result }}
          UNIT_OLDEST_EXECUTION: ${{ needs.unit-oldest-execute.result }}
          UNIT_NEWEST_EXECUTION: ${{ needs.unit-newest-execute.result }}
          STORE_EXECUTION: ${{ needs.store-execute.result }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$CHANGES_RESULT" == success ]] || {
            echo "::error::Change classification did not succeed: $CHANGES_RESULT"
            exit 1
          }
          [[ "$SITE_RESULT" == success ]] || {
            echo "::error::Site verification did not succeed: $SITE_RESULT"
            exit 1
          }
          for result in \
            "project drift:$PROJECT_DRIFT_RESULT" \
            "oldest unit:$UNIT_OLDEST_RESULT" \
            "newest unit:$UNIT_NEWEST_RESULT" \
            "store:$STORE_RESULT"; do
            name=${result%%:*}
            conclusion=${result#*:}
            [[ "$conclusion" == success ]] || {
              echo "::error::Application route $APP_ROUTE produced $name gate result $conclusion."
              exit 1
            }
          done
          if [[ "$EVENT_NAME" == pull_request && "$APP_ROUTE" == true ]]; then
            [[ "$MERGE_RESULT" == success ]] || {
              echo "::error::Prospective-merge compatibility did not succeed: $MERGE_RESULT"
              exit 1
            }
          else
            [[ "$MERGE_RESULT" == skipped ]] || {
              echo "::error::Unexpected prospective-merge result: $MERGE_RESULT"
              exit 1
            }
          fi
          [[ "$SCHEMA" == flowlight-review-v3 ]] || {
            echo "::error::Unexpected review receipt schema: $SCHEMA"
            exit 1
          }
          [[ -n "$HEAD_SHA" && -n "$TREE" && -n "$FINGERPRINT" ]] || {
            echo "::error::The review receipt identity is incomplete."
            exit 1
          }
          mode=not_applicable
          if [[ "$APP_ROUTE" == true ]]; then
            mode=executed
            if [[ "$REUSE" == true ]]; then
              mode=reused
              [[ -n "$SOURCE_RUN_ID" && -n "$SOURCE_RUN_ATTEMPT" && \
                 -n "$SOURCE_ARTIFACT_ID" && -n "$SOURCE_ARTIFACT_NAME" && \
                 -n "$SOURCE_ARTIFACT_DIGEST" ]] || {
                echo "::error::Reusable evidence identity is incomplete."
                exit 1
              }
            fi
          fi
          jq -n \
            --arg schema "$SCHEMA" \
            --arg repository "$REPOSITORY" \
            --arg workflow ".github/workflows/ci.yml" \
            --arg event "$EVENT_NAME" \
            --arg source_sha "$HEAD_SHA" \
            --arg source_tree "$TREE" \
            --arg app_fingerprint "$FINGERPRINT" \
            --argjson app_route "$APP_ROUTE" \
            --arg changes "$CHANGES_RESULT" \
            --arg site "$SITE_RESULT" \
            --arg project_drift "$PROJECT_DRIFT_RESULT" \
            --arg unit_oldest "$UNIT_OLDEST_RESULT" \
            --arg unit_newest "$UNIT_NEWEST_RESULT" \
            --arg store "$STORE_RESULT" \
            --arg merge_compatibility "$MERGE_RESULT" \
            --argjson run_id "$RUN_ID" \
            --argjson run_attempt "$RUN_ATTEMPT" \
            --arg mode "$mode" \
            --arg source_run_id "$SOURCE_RUN_ID" \
            --arg source_run_attempt "$SOURCE_RUN_ATTEMPT" \
            --arg source_artifact_id "$SOURCE_ARTIFACT_ID" \
            --arg source_artifact_name "$SOURCE_ARTIFACT_NAME" \
            --arg source_artifact_digest "$SOURCE_ARTIFACT_DIGEST" \
            '{schema: $schema, repository: $repository, workflow: $workflow, event: $event,
              source_sha: $source_sha, source_tree: $source_tree, app_fingerprint: $app_fingerprint,
              app_route: $app_route,
              conclusions: {changes: $changes, site: $site, project_drift: $project_drift,
                            unit_oldest: $unit_oldest, unit_newest: $unit_newest, store: $store,
                            merge_compatibility: $merge_compatibility},
              run_id: $run_id, run_attempt: $run_attempt,
              app_evidence: {mode: $mode,
                source: (if $mode == "reused" then
                  {run_id: ($source_run_id | tonumber), run_attempt: ($source_run_attempt | tonumber),
                   artifact_id: ($source_artifact_id | tonumber), artifact_name: $source_artifact_name,
                   artifact_digest: $source_artifact_digest}
                 else null end)}}' \
            > "$RUNNER_TEMP/review-receipt.json"
          {
            echo "### Review gate passed"
            echo
            echo "- Source: \`$HEAD_SHA\`"
            echo "- Tree: \`$TREE\`"
            echo "- App route: \`$APP_ROUTE\`"
            echo "- App fingerprint: \`$FINGERPRINT\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve the shadow verification receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: review-receipt-${{ needs.changes.outputs.head_sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/review-receipt.json
          if-no-files-found: error
          retention-days: 30
