name: CI

# Builds and tests every push and pull request. No secrets are used here, so it runs for forks too.
#
# The macOS matrix is the expensive part — two Xcode versions, a full test run each — and a change that only
# touches the website cannot break a Swift build. So the site is checked on every commit (it is seconds of Python)
# and the app is built only when something outside the site has changed.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Supersede a pull request's earlier run, but let a push to main finish. Cancelling those meant a string of
  # quick commits left no completed run at all, and the result everyone was waiting on never existed.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # What changed, so the expensive job can be skipped when nothing it covers did.
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.what.outputs.app }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - id: what
        name: Did anything outside the website change?
        run: |
          set -euo pipefail
          # Anything we can't compare against runs the full build. Being wrong in that direction costs ten
          # minutes; being wrong the other way ships an untested commit.
          case "${{ github.event_name }}" in
            pull_request) base="${{ github.event.pull_request.base.sha }}" ;;
            push)         base="${{ github.event.before }}" ;;
            *)            base="" ;;
          esac
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "No base to compare against — building everything."
            echo "app=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$base" "${{ github.sha }}")
          echo "::group::Changed files"; echo "$changed"; echo "::endgroup::"
          # The website and its sources. Everything else — Swift, project.yml, packaging, these workflows —
          # is the app. project.yml is deliberately *not* here: it carries the version the site prints, but it
          # also carries the build, and a version bump should be built.
          rest=$(echo "$changed" | grep -Ev '^(site/|docs/|scripts/build_site\.py$|[^/]*\.md$|LICENSE$)' || true)
          if [ -z "$rest" ]; then
            echo "Website-only change — skipping the macOS build."
            echo "app=false" >> "$GITHUB_OUTPUT"
          else
            echo "app=true" >> "$GITHUB_OUTPUT"
          fi

  # Seconds of Python, so it runs on everything: the site is generated from Swift sources and project.yml as well
  # as from site/, and "docs/ is out of date" should be caught whichever of those moved.
  site:
    runs-on: ubuntu-latest
    steps:
      # Full history: the sitemap dates each page from the commit that last touched its source, and a shallow
      # clone can only see one commit, so every page would look as though it changed today.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Check the site builds and is committed
        run: |
          python3 scripts/build_site.py
          git diff --exit-code -- docs/ || {
            echo "::error::docs/ is out of date — run scripts/build_site.py and commit the result."
            exit 1
          }

  test:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        # README says Xcode 16 or later, so both ends of that are built. The oldest one earns its place: it is
        # stricter about expressions the type checker has to explore, and it caught two the newest compiler accepts.
        xcode: [oldest, newest]
    name: test (${{ matrix.xcode }} Xcode)
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Select Xcode
        run: |
          set -euo pipefail
          if [[ "${{ matrix.xcode }}" == "newest" ]]; then
            sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          else
            sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | head -1)"
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the project
        run: xcodegen generate

      # Ad-hoc signing: the entitlements that need a Developer ID profile are only exercised by the release build.
      - name: Test
        timeout-minutes: 40
        run: |
          # GitHub runs this step under `bash -e`, so the first failing command ends it. That killed the whole
          # point of the reporting below: a failing test exited 65 with no output at all, and the log saying
          # which test failed was thrown away with the runner. `set +e` has to be explicit — the `set` line
          # below can't clear a flag the shell was started with.
          set +e
          set -uo pipefail
          # xcodebuild occasionally never returns here — the same suite passes locally and on most runs, and the
          # per-test allowance below doesn't always catch it, so the whole invocation gets a watchdog. One retry:
          # a hang that clears on a second attempt is a flake, and one that repeats is a real failure worth seeing.
          run_tests() {
            local log="$1" limit=900
            xcodebuild test -project Flowlight.xcodeproj -scheme Flowlight -destination 'platform=macOS' \
              -test-timeouts-enabled YES \
              -default-test-execution-time-allowance 120 \
              -maximum-test-execution-time-allowance 300 \
              CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= CODE_SIGN_ENTITLEMENTS= > "$log" 2>&1 &
            local pid=$!
            local waited=0
            while kill -0 "$pid" 2>/dev/null; do
              if [ "$waited" -ge "$limit" ]; then
                echo "::warning::xcodebuild still running after ${limit}s — killing it."
                kill -9 "$pid" 2>/dev/null
                pkill -9 -f "xcodebuild|XCTestCore|testmanagerd" 2>/dev/null
                wait "$pid" 2>/dev/null
                return 124
              fi
              sleep 5
              waited=$((waited + 5))
            done
            wait "$pid"
          }

          LOG="$RUNNER_TEMP/test.log"
          run_tests "$LOG"
          status=$?
          grep -E "Test Case .* (passed|failed)|Executed .* tests|\*\* TEST" "$LOG" | tail -25

          if [ "$status" -eq 124 ]; then
            echo "::group::Where it stopped (last 60 lines before the kill)"; tail -60 "$LOG"; echo "::endgroup::"
            echo "Retrying once."
            LOG="$RUNNER_TEMP/test-retry.log"
            run_tests "$LOG"
            status=$?
            grep -E "Executed .* tests|\*\* TEST" "$LOG" | tail -10
          fi

          if [ "$status" -ne 0 ]; then
            echo "::group::Last 300 lines"; tail -300 "$LOG"; echo "::endgroup::"
            echo "Why it failed (status $status):"
            # Outside the group, so it is the first thing visible on a failed run.
            grep -E "error:|Testing failed:|XCTAssert.*failed|exceeded execution time allowance" "$LOG" | head -40
            exit 1
          fi
