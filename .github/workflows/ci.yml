name: CI

# Builds and tests every push and pull request. No secrets are used here, so it runs for forks too.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0

      # The newest Xcode on the image, named in the log so a release says which compiler built it.
      - name: Select Xcode
        run: |
          set -euo pipefail
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the project
        run: xcodegen generate

      # Ad-hoc signing: the entitlements that need a Developer ID profile are only exercised by the release build.
      - name: Test
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/test.log"
          if ! xcodebuild test -project Flowlight.xcodeproj -scheme Flowlight -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= CODE_SIGN_ENTITLEMENTS= > "$LOG" 2>&1; then
            echo "::group::Last 300 lines"; tail -300 "$LOG"; echo "::endgroup::"
            echo "Why it failed:"
            grep -E "error:|Testing failed:|XCTAssert.*failed|failed \(" "$LOG" | head -40
            exit 1
          fi
          grep -E "Executed .* tests|\*\* TEST" "$LOG" | tail -20

      - name: Check the site builds and is committed
        run: |
          python3 scripts/build_site.py
          git diff --exit-code -- docs/ || {
            echo "::error::docs/ is out of date — run scripts/build_site.py and commit the result."
            exit 1
          }
