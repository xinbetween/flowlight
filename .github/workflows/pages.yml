# Deploys only the exact docs/ payload validated by a successful canonical CI push to main.
name: Pages

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

permissions: {}

# Serialize the source-is-current check with deployment. An older queued run fails stale after main advances;
# deployments are never cancelled halfway through.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  prepare:
    name: verify Pages provenance
    if: >-
      github.repository == 'xinbetween/flowlight' &&
      github.event.workflow_run.repository.full_name == 'xinbetween/flowlight' &&
      github.event.workflow_run.head_repository.full_name == 'xinbetween/flowlight' &&
      github.event.workflow_run.path == '.github/workflows/ci.yml' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.status == 'completed' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      source_sha: ${{ steps.payload.outputs.source_sha }}
      source_tree: ${{ steps.payload.outputs.source_tree }}
      source_run_id: ${{ steps.payload.outputs.source_run_id }}
      source_artifact_id: ${{ steps.payload.outputs.source_artifact_id }}
      source_artifact_digest: ${{ steps.payload.outputs.source_artifact_digest }}
    steps:
      # No checkout: Pages consumes bytes CI already validated. Fetching the verifier from the source SHA happens
      # only after a small independent gate proves that SHA is the canonical main tip and the event is its CI push.
      - name: Fetch the verifier from the still-current canonical source
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_REPOSITORY: ${{ github.event.workflow_run.repository.full_name }}
          HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          SOURCE_WORKFLOW: ${{ github.event.workflow_run.path }}
          SOURCE_EVENT: ${{ github.event.workflow_run.event }}
          SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch }}
          SOURCE_STATUS: ${{ github.event.workflow_run.status }}
          SOURCE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          [[ "$REPOSITORY" == xinbetween/flowlight ]]
          [[ "$SOURCE_REPOSITORY" == "$REPOSITORY" ]]
          [[ "$HEAD_REPOSITORY" == "$REPOSITORY" ]]
          [[ "$SOURCE_WORKFLOW" == .github/workflows/ci.yml ]]
          [[ "$SOURCE_EVENT" == push ]]
          [[ "$SOURCE_BRANCH" == main ]]
          [[ "$SOURCE_STATUS" == completed ]]
          [[ "$SOURCE_CONCLUSION" == success ]]
          CURRENT_MAIN=$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq .object.sha)
          [[ "$SOURCE_SHA" == "$CURRENT_MAIN" ]] || {
            echo "::error::CI source $SOURCE_SHA is stale; main is now $CURRENT_MAIN."
            exit 1
          }
          gh api -H 'Accept: application/vnd.github.raw+json' \
            "repos/$REPOSITORY/contents/scripts/workflow_evidence.py?ref=$SOURCE_SHA" \
            > "$RUNNER_TEMP/workflow_evidence.py"

      - id: payload
        name: Download and verify the exact CI artifact and manifest
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 -I "$RUNNER_TEMP/workflow_evidence.py" consume-pages \
            --event-json "$GITHUB_EVENT_PATH" \
            --repository "$REPOSITORY" \
            --output "$RUNNER_TEMP/verified-site" \
            --github-output "$GITHUB_OUTPUT"

      - name: Upload the verified site for Pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/verified-site

  deploy:
    name: deploy Pages
    needs: prepare
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Recheck after the queued verification job. The repository is public, so this needs no contents permission
      # and the deployment job keeps only the two permissions required by Pages itself.
      - name: Reject a source that became stale before deployment
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          set -euo pipefail
          CURRENT_MAIN=$(curl --fail --silent --show-error \
            --connect-timeout 10 --max-time 30 \
            https://api.github.com/repos/xinbetween/flowlight/git/ref/heads/main | jq -r .object.sha)
          [[ "$SOURCE_SHA" == "$CURRENT_MAIN" ]] || {
            echo "::error::Verified source $SOURCE_SHA is stale; main is now $CURRENT_MAIN."
            exit 1
          }

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
