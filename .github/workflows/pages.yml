# Publishes docs/ to GitHub Pages.
#
# Pages can deploy a branch folder on its own, and did until now. That path runs a workflow GitHub generates
# and we cannot edit, built on actions that are a major version behind — which is where the "Node.js 20 is
# deprecated" warning on every push came from. Doing it here instead means the actions are ours to keep
# current, and the site is only rebuilt when something it serves has changed.
name: Pages

on:
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and a newer push wins — but never cancel one midway, because a half-finished
# deployment is a half-updated site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # docs/ is committed and CI already checks it matches a fresh build, so there is nothing to build here.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
