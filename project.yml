name: Flowlight
options:
  bundleIdPrefix: com.flowlight
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    MARKETING_VERSION: "0.3.5"
    CURRENT_PROJECT_VERSION: "8"
targets:
  Flowlight:
    type: application
    platform: macOS
    sources:
      - Flowlight
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flowlight.app
        PRODUCT_NAME: Flowlight
        # Set by scripts/build-signed.sh for Developer ID builds; empty for ad-hoc local builds.
        PROVISIONING_PROFILE_SPECIFIER: $(FL_APP_PROFILE)
        INFOPLIST_FILE: Flowlight/Info.plist
        CODE_SIGN_ENTITLEMENTS: Flowlight/Flowlight.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: FlowlightExtension
        embed: true
        codeSign: true
        copy:
          destination: plugins
          subpath: ../Library/SystemExtensions
      - sdk: libsqlite3.tbd
      - sdk: NetworkExtension.framework
      - sdk: SystemExtensions.framework
  FlowlightExtension:
    type: system-extension
    platform: macOS
    sources:
      - FlowlightExtension
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flowlight.app.filter
        PRODUCT_NAME: com.flowlight.app.filter
        PROVISIONING_PROFILE_SPECIFIER: $(FL_EXT_PROFILE)
        INFOPLIST_FILE: FlowlightExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: FlowlightExtension/FlowlightExtension.entitlements
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
    dependencies:
      - sdk: NetworkExtension.framework
  FlowlightTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - FlowlightTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flowlight.app.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Flowlight.app/Contents/MacOS/Flowlight"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: Flowlight
schemes:
  Flowlight:
    build:
      targets:
        Flowlight: all
        FlowlightTests: [test]
    test:
      targets:
        - FlowlightTests
