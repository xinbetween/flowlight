name: Flowlight
configs:
  Debug: debug
  Release: release
  AppStore: release
options:
  bundleIdPrefix: com.flowlight
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    MARKETING_VERSION: "0.16.0"
    CURRENT_PROJECT_VERSION: "62"
  configs:
    AppStore:
      DEVELOPMENT_TEAM: 38RJUJHKZS
targets:
  Flowlight:
    type: application
    platform: macOS
    sources:
      - Flowlight
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flowlight.app
        PRODUCT_NAME: Flowlight
        # Set by scripts/build-signed.sh for Developer ID builds; empty for ad-hoc local builds.
        PROVISIONING_PROFILE_SPECIFIER: $(FL_APP_PROFILE)
        INFOPLIST_FILE: Flowlight/Info.plist
        CODE_SIGN_ENTITLEMENTS: Flowlight/Flowlight.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: FlowlightExtension
        embed: true
        codeSign: true
        copy:
          destination: plugins
          subpath: ../Library/SystemExtensions
      - target: FlowlightResponseScriptHelper
        embed: true
        codeSign: true
        copy:
          destination: executables
          subpath: ../Library/Helpers
      - sdk: libsqlite3.tbd
      - sdk: NetworkExtension.framework
      - sdk: SystemExtensions.framework
      - sdk: CoreMediaIO.framework
  FlowlightResponseScriptHelper:
    type: tool
    platform: macOS
    sources:
      - FlowlightResponseScriptHelper
    settings:
      base:
        PRODUCT_NAME: FlowlightResponseScriptHelper
        # The executable is embedded in Flowlight.app; it must not appear as a second top-level archive product.
        SKIP_INSTALL: YES
    dependencies:
      - sdk: JavaScriptCore.framework
  FlowlightExtension:
    type: system-extension
    platform: macOS
    sources:
      - path: FlowlightExtension
        excludes:
          - Info-AppStore.plist
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flowlight.app.filter
        PRODUCT_NAME: com.flowlight.app.filter
        PROVISIONING_PROFILE_SPECIFIER: $(FL_EXT_PROFILE)
        INFOPLIST_FILE: FlowlightExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: FlowlightExtension/FlowlightExtension.entitlements
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        # The extension's version is pinned in FlowlightExtension/Info.plist, on its own lifecycle rather than the
        # app's, so an app-only update replaces no extension and needs no restart. It is set there, not as a
        # MARKETING_VERSION override here, because the release workflow reads MARKETING_VERSION out of this file and
        # a second one would break its tag/version check.
    dependencies:
      - sdk: NetworkExtension.framework
  FlowlightStoreExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: FlowlightExtension
        excludes:
          - Info.plist
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flowlight.app.filter
        PRODUCT_NAME: com.flowlight.app.filter
        INFOPLIST_FILE: FlowlightExtension/Info-AppStore.plist
        CODE_SIGN_ENTITLEMENTS: FlowlightExtension/FlowlightExtension-AppStore.entitlements
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) APP_STORE"
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    dependencies:
      - sdk: NetworkExtension.framework
  FlowlightAppStore:
    type: application
    platform: macOS
    sources:
      - path: Flowlight
        excludes:
          - Resources/bpf-access.sh
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flowlight.app
        PRODUCT_NAME: Flowlight
        INFOPLIST_FILE: Flowlight/Info.plist
        CODE_SIGN_ENTITLEMENTS: Flowlight/Flowlight-AppStore.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) APP_STORE"
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    dependencies:
      - target: FlowlightStoreExtension
        embed: true
        codeSign: true
      - sdk: libsqlite3.tbd
      - sdk: NetworkExtension.framework
      - sdk: CoreMediaIO.framework
  FlowlightTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - FlowlightTests
      - path: docs/docs/index.html
        buildPhase: resources
      - path: FlowlightTests/Fixtures/IPCServer.txt
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flowlight.app.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Flowlight.app/Contents/MacOS/Flowlight"
        BUNDLE_LOADER: "$(TEST_HOST)"
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    dependencies:
      - target: Flowlight
schemes:
  Flowlight:
    build:
      targets:
        Flowlight: all
        FlowlightTests: [test]
    test:
      targets:
        - FlowlightTests
  Flowlight App Store:
    build:
      targets:
        FlowlightAppStore: all
    archive:
      config: AppStore
